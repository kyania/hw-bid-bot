<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HW Bid Bot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- ── Header ─────────────────────────────────── -->
    <div class="header">
      <div class="header-left">
        <span class="logo">🤖</span>
        <h1>HW Bid Bot</h1>
      </div>
      <div class="status-badge" id="statusBadge">OFF</div>
    </div>

    <!-- ── Control ────────────────────────────────── -->
    <div class="control-section">
      <div class="btn-row">
        <button id="toggleBtn" class="btn-toggle start">▶ Start Bot</button>
        <button id="refreshBtn" class="btn-refresh">🔄 Restart Scan</button>
      </div>
      <div class="stats-row">
        <span class="stat-item">Session bids: <strong id="sessionBids">0</strong></span>
        <span class="stat-item">Total bids: <strong id="totalBids">0</strong></span>
      </div>
      <div id="botStatus" class="bot-status idle">Idle — navigate to the browse page to begin</div>
      <button id="inspectBtn" class="btn-inspect">🔍 Inspect Current Page</button>
    </div>

    <div class="divider"></div>

    <!-- ── Settings ───────────────────────────────── -->
    <div class="settings-section">
      <h2>Settings</h2>

      <!-- Subject fields -->
      <div class="field-group">
        <label class="field-label" for="fieldsInput">Subject Fields</label>
        <input
          id="fieldsInput"
          type="text"
          placeholder="e.g. english, physics, nursing, mathematics"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="field-hint">Comma-separated. Leave empty to bid on all categories.</span>
      </div>

      <!-- Refresh interval -->
      <div class="field-group">
        <label class="field-label" for="refreshIntervalInput">
          Browse Refresh Interval
        </label>
        <div class="refresh-interval-row">
          <input
            id="refreshIntervalInput"
            type="number"
            min="1"
            max="3600"
            placeholder="8"
          />
          <span class="refresh-unit">seconds between page refreshes</span>
        </div>
        <span class="field-hint">How long to wait after checking all projects before reloading the browse page.</span>
      </div>

      <!-- Message 1 — Bid message -->
      <div class="field-group">
        <label class="field-label" for="msg1">
          Bid Message
          <span class="msg-tag initial">Sent with every bid</span>
        </label>
        <textarea id="msg1" rows="6"
          placeholder="Enter the message sent with every bid..."></textarea>
      </div>

      <!-- Save -->
      <button id="saveBtn" class="btn-save">Save Settings</button>
      <div id="saveStatus" class="save-status"></div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
